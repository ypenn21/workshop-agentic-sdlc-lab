[project]
name = "account-health"
version = "0.1.0"
description = "Scores account health from a monthly usage export"
requires-python = ">=3.11"
dependencies = [
    "google-antigravity",
    "pydantic>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23.0",
    "pydantic>=2.0.0,<3.0.0",
    "google-antigravity>=0.1.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "scorer"]
testpaths = ["scorer/tests", ".github/scripts/tests", ".github/tests"]
asyncio_mode = "auto"
